<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic tac toe</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1>TIC TAC TOE</h1>
    <div class="players">
        <input class="p1" type="text" placeholder="Player 1">
        <input class="p2" type="text" placeholder="Player 2">
        <button class="play">Play</button>
    </div>

    <div class="letrero">

    </div>


    <div class="game-board">

        <div class="cell cell0"></div>
        <div class="cell cell1"></div>
        <div class="cell cell2"></div>

        <div class="cell cell3"></div>
        <div class="cell cell4"></div>
        <div class="cell cell5"></div>
        <div class="cell cell6"></div>
        <div class="cell cell7"></div>
        <div class="cell cell8"></div>

    </div>





    <script src="./script.js"></script>
</body>

</html>
